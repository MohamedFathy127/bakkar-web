name: Excel import checks

on:
  push:
    branches:
      - main
      - feature/excel-import
      - feature/inventory-management
      - integration/safe-inventory-release
  pull_request:
    branches:
      - main
      - feature/inventory-management
      - integration/safe-inventory-release

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/inventory.js
          node --check src/excel-import.js
          node --check src/catalog.js
          node --check ../../catalog-client.mjs
      - name: Apply all migrations to a fresh local D1
        run: npm exec -- wrangler d1 migrations apply bakkar-inventory-test --local --config wrangler.test.jsonc --persist-to .wrangler/ci-migrations --force
      - name: Run import edge-case tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(src/*.test.js)
          if (("${#tests[@]}" > 0)); then
            node --test "${tests[@]}"
          else
            echo "::notice::No edge-case test files exist on this ref; skipping this optional step."
          fi
      - name: Bundle against isolated test Worker config
        run: npm exec -- wrangler deploy --dry-run --config wrangler.test.jsonc
