name: Excel import checks

on:
  push:
    branches:
      - main
      - feature/excel-import
      - feature/inventory-management
  pull_request:
    branches:
      - main
      - feature/inventory-management

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/inventory.js
          node --check src/excel-import.js
      - name: Run import edge-case tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(src/*.test.js)
          if (("${#tests[@]}" > 0)); then
            node --test "${tests[@]}"
          else
            echo "::notice::No edge-case test files exist on this ref; skipping this optional step."
          fi
      - name: Bundle against isolated test Worker config
        run: npx wrangler deploy --dry-run --config wrangler.test.jsonc
