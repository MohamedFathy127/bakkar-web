name: Inventory Worker checks

on:
  pull_request:
    paths:
      - "backend/worker/**"
      - ".github/workflows/inventory-worker-check.yml"
  push:
    branches:
      - "feature/inventory-management"
    paths:
      - "backend/worker/**"
      - ".github/workflows/inventory-worker-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker modules
        run: |
          node --check backend/worker/src/index.js
          node --check backend/worker/src/inventory.js
      - name: Validate test Worker bundle and configuration
        working-directory: backend/worker
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.test.jsonc
